# Controls GitHub's auto-generated release notes.
changelog:
  exclude:
    labels:
      - dependencies
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions
      - github-actions[bot]
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 修正
      labels:
        - bug
        - fix
    - title: 其他變更
      labels:
        - "*"
