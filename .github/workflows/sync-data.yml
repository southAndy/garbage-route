name: Sync official garbage routes

on:
  schedule:
    # Sunday 21:23 UTC = Monday 05:23 Asia/Taipei. GitHub may delay scheduled runs.
    - cron: "23 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-data-sync
  cancel-in-progress: false

jobs:
  sync:
    # Manual runs must also target the production/default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Check deployment configuration
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::Add the VERCEL_DEPLOY_HOOK repository secret before running this workflow. See README.md."
            exit 1
          fi

      - run: npm ci
      - run: npm run sync:data
      - run: npm test
      - run: npm run lint

      - name: Verify production build before publishing data
        run: npm run build
        env:
          SITE_URL: https://trash.andywalking.tw
          VERCEL_ENV: production

      # The default branch only accepts changes through a pull request, so the
      # snapshot goes to a short-lived branch and is merged via its own PR.
      - name: Publish the validated snapshot and check time through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_BRANCH: ${{ github.event.repository.default_branch }}
          SYNC_BRANCH: data-sync/${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT_TITLE: "chore(data): refresh official routes and check time"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/routes.json data/manifest.json data/suspicious-coordinates.json
          if ! git diff --cached --quiet; then
            git switch -c "$SYNC_BRANCH"
            git commit -m "$COMMIT_TITLE"
            git push origin "$SYNC_BRANCH"
            snapshot_sha=$(git rev-parse HEAD)
            pr_number=$(gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
              -f base="$PRODUCTION_BRANCH" -f head="$SYNC_BRANCH" -f title="$COMMIT_TITLE" \
              -f body="Validated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq '.number')
            pr_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr_number"
            echo "Data sync pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

            # GitHub computes mergeability asynchronously, so the first attempts can be refused.
            # A conflicting concurrent update never merges; fix or close the PR, then rerun.
            merged=false
            for attempt in 1 2 3 4 5; do
              if result=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr_number/merge" \
                -f sha="$snapshot_sha" -f merge_method=merge --jq '.merged') && [ "$result" = true ]; then
                merged=true
                break
              fi
              if [ "$attempt" -lt 5 ]; then sleep 10; fi
            done
            if [ "$merged" != true ]; then
              echo "::error::Could not confirm the snapshot was merged. Check $pr_url."
              exit 1
            fi
            # The repository may already have deleted the branch after merge.
            git push origin --delete "$SYNC_BRANCH" || echo "::notice::Check whether $SYNC_BRANCH still needs cleanup."
          fi

      - name: Trigger Vercel deployment
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          curl --fail --silent --show-error --max-time 60 \
            --request POST "$VERCEL_DEPLOY_HOOK" --output /dev/null
          echo "Deployment requested. Check Vercel for the build result." >> "$GITHUB_STEP_SUMMARY"
